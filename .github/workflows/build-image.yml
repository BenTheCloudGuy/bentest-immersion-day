name: Build lab image

# Builds the Windows 11 multi-session image on the self-hosted runner inside the lab VNet.
# A change to packer/CHANGELOG.md on main starts a build of the version in its first "## [x.y.z]" heading; an existing gallery version is skipped.
# Variables are set by deploy-packer-prereqs.yml (or the setup script's Runner stage). Authentication uses the pre-staged SPN.
on:
  push:
    branches: [main]
    paths:
      - packer/CHANGELOG.md
  workflow_dispatch:
    inputs:
      image_version:
        description: Gallery image version (Major.Minor.Patch); empty uses packer/CHANGELOG.md
        required: false
        default: ''
        type: string
      image_sku:
        description: Windows 11 multi-session marketplace SKU
        required: false
        default: win11-26h2-avd
        type: string
      vm_size:
        description: Temporary Packer build VM size
        required: false
        default: Standard_D4s_v5
        type: string
      source_image_version:
        description: Marketplace source image version
        required: false
        default: latest
        type: string
      on_error:
        description: Packer behavior when the build fails (abort keeps the temporary VM for troubleshooting)
        required: false
        default: abort
        type: choice
        options:
          - abort
          - cleanup

permissions:
  contents: read

concurrency:
  group: build-lab-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, msftlabs-image]
    timeout-minutes: 150
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets
        shell: pwsh
        run: |
          foreach ($name in 'ARM_CLIENT_ID', 'ARM_CLIENT_SECRET', 'ARM_TENANT_ID', 'ARM_SUBSCRIPTION_ID') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required Actions secret '$name' is not set."
            }
          }

      - name: Sign in with the pre-staged service principal
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password="$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID" --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Resolve image version
        id: image
        env:
          INPUT_VERSION: ${{ inputs.image_version }}
          INPUT_SKU: ${{ inputs.image_sku }}
        run: |
          version="${INPUT_VERSION:-$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' packer/CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')}"
          if [ -z "$version" ]; then
            echo "No version found in packer/CHANGELOG.md" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Image version must use numeric Major.Minor.Patch format.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sku=${INPUT_SKU:-win11-26h2-avd}" >> "$GITHUB_OUTPUT"
          state=$(az sig image-version list \
            --resource-group "${{ vars.GALLERY_RESOURCE_GROUP }}" \
            --gallery-name "${{ vars.GALLERY_NAME }}" \
            --gallery-image-definition "${{ vars.IMAGE_DEFINITION_NAME }}" \
            --query "[?name=='$version'].provisioningState | [0]" --output tsv)
          if [ "$state" = Succeeded ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Image version $version already exists in the gallery; skipping the build."
          elif [ -z "$state" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Image version $version already exists with provisioning state '$state'; it cannot be overwritten." >&2
            exit 1
          fi

      - name: Write Packer variables
        if: steps.image.outputs.exists != 'true'
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
          IMAGE_SKU: ${{ steps.image.outputs.sku }}
          VM_SIZE: ${{ inputs.vm_size || 'Standard_D4s_v5' }}
          SOURCE_IMAGE_VERSION: ${{ inputs.source_image_version || 'latest' }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          GALLERY_RESOURCE_GROUP: ${{ vars.GALLERY_RESOURCE_GROUP }}
          GALLERY_NAME: ${{ vars.GALLERY_NAME }}
          IMAGE_DEFINITION_NAME: ${{ vars.IMAGE_DEFINITION_NAME }}
          VNET_NAME: ${{ vars.VNET_NAME }}
          VNET_RESOURCE_GROUP: ${{ vars.VNET_RESOURCE_GROUP }}
          VNET_SUBNET_NAME: ${{ vars.VNET_SUBNET_NAME }}
          REPLICATION_REGIONS: ${{ vars.REPLICATION_REGIONS }}
          RESOURCE_TAGS: ${{ vars.RESOURCE_TAGS }}
        run: |
          jq -n \
            --arg subscription_id "$ARM_SUBSCRIPTION_ID" \
            --arg tenant_id "$ARM_TENANT_ID" \
            --arg location "$AZURE_LOCATION" \
            --arg gallery_resource_group "$GALLERY_RESOURCE_GROUP" \
            --arg gallery_name "$GALLERY_NAME" \
            --arg image_definition_name "$IMAGE_DEFINITION_NAME" \
            --arg image_version "$IMAGE_VERSION" \
            --arg image_sku "$IMAGE_SKU" \
            --arg vm_size "$VM_SIZE" \
            --arg source_image_version "$SOURCE_IMAGE_VERSION" \
            --arg virtual_network_name "$VNET_NAME" \
            --arg virtual_network_resource_group_name "$VNET_RESOURCE_GROUP" \
            --arg virtual_network_subnet_name "$VNET_SUBNET_NAME" \
            --argjson replication_regions "$REPLICATION_REGIONS" \
            --argjson tags "$RESOURCE_TAGS" \
            '$ARGS.named' > build.pkrvars.json

      - name: Packer init and validate
        if: steps.image.outputs.exists != 'true'
        run: |
          packer init packer/windows11
          packer validate -var-file=build.pkrvars.json packer/windows11

      - name: Packer build
        if: steps.image.outputs.exists != 'true'
        run: packer build -on-error=${{ inputs.on_error || 'abort' }} -color=false -var-file=build.pkrvars.json packer/windows11
